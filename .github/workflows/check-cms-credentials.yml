name: Check MENTAL CMS credentials
on:
  push:
    branches: ['feature/articles-cms-secret-check-20261126']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      ADMIN_EMAIL: ${{ secrets.CMS_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.CMS_ADMIN_PASSWORD }}
      ADMIN_HASH: ${{ secrets.CMS_ADMIN_PASSWORD_HASH }}
      JWT_SECRET: ${{ secrets.CMS_JWT_SECRET }}
      EDITORIAL_TOKEN: ${{ secrets.MENTAL_EDITORIAL_API_TOKEN }}
    steps:
      - shell: bash
        run: |
          for v in ADMIN_EMAIL ADMIN_PASSWORD ADMIN_HASH JWT_SECRET EDITORIAL_TOKEN; do
            if [ -n "${!v}" ]; then echo "$v=yes"; else echo "$v=no"; fi
          done
