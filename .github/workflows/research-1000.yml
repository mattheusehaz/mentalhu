name: Public directory research
on:
  push:
    branches: [data/expansion-1000-20261106]
    paths: [scripts/research-1000.py, .github/workflows/research-1000.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/research-1000.py
      - name: Save source audit on research branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/expansion-20261106
          git diff --cached --quiet || git commit -m 'Save public source audit and existing catalog snapshot'
          git push origin HEAD:data/expansion-1000-20261106
