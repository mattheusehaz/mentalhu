name: PostgreSQL certificate integration checks

on:
  push:
    branches: [main, fix/database-ca-20261106]
    paths:
      - server.js
      - lib/database-config.cjs
      - scripts/apply-db-tls.cjs
      - scripts/test-database-tls.cjs
      - .github/workflows/database-tls.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-local-database-only
          POSTGRES_DB: mentalhu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d mentalhu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci-local-database-only@127.0.0.1:5432/mentalhu_test
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply targeted CA repair
        run: |
          node scripts/apply-db-tls.cjs
          node --check server.js
          node --check lib/database-config.cjs
          node --check scripts/test-database-tls.cjs
      - name: Install locked dependencies
        run: npm ci
      - name: Regression tests with real PostgreSQL
        run: node scripts/test-directory-db.cjs
      - name: Give disposable PostgreSQL a private CA and server certificate
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/pg-tls"
          cd "$RUNNER_TEMP/pg-tls"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 1 -subj '/CN=MENTAL CI Test CA' -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj '/CN=localhost' 2>/dev/null
          printf 'subjectAltName=DNS:localhost\nbasicConstraints=critical,CA:FALSE\nkeyUsage=digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\n' > server.ext
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 1 -extfile server.ext 2>/dev/null
          cat server.crt ca.crt > server-chain.crt
          docker cp server-chain.crt "$PG_CONTAINER:/tmp/server.crt"
          docker cp server.key "$PG_CONTAINER:/tmp/server.key"
          docker exec -u root "$PG_CONTAINER" sh -c 'chown postgres:postgres /tmp/server.key /tmp/server.crt && chmod 600 /tmp/server.key'
          docker exec "$PG_CONTAINER" psql -U ci -d mentalhu_test -c "ALTER SYSTEM SET ssl_cert_file = '/tmp/server.crt'"
          docker exec "$PG_CONTAINER" psql -U ci -d mentalhu_test -c "ALTER SYSTEM SET ssl_key_file = '/tmp/server.key'"
          docker exec "$PG_CONTAINER" psql -U ci -d mentalhu_test -c "ALTER SYSTEM SET ssl = on"
          docker exec "$PG_CONTAINER" psql -U ci -d mentalhu_test -c 'SELECT pg_reload_conf()'
          echo "TLS_TEST_CA_FILE=$RUNNER_TEMP/pg-tls/ca.crt" >> "$GITHUB_ENV"
      - name: Reproduce certificate error and test secured fix end to end
        env:
          TLS_TEST_DATABASE_URL: postgresql://ci:ci-local-database-only@localhost:5432/mentalhu_test?sslmode=require
        run: node scripts/test-database-tls.cjs
      - name: Save tested server change only on repair branch
        if: github.ref == 'refs/heads/fix/database-ca-20261106'
        run: |
          if git diff --quiet -- server.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          git commit -m 'Use validated CA-aware database configuration after TLS integration checks'
          git push origin HEAD:fix/database-ca-20261106
      - name: Main must contain the tested configuration
        if: github.ref == 'refs/heads/main'
        run: git diff --exit-code -- server.js
