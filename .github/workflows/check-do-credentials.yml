name: Check DigitalOcean deploy credentials
on:
  push:
    branches: ['feature/articles-do-secret-check-20261126']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      S1: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      S2: ${{ secrets.DIGITALOCEAN_TOKEN }}
      S3: ${{ secrets.DO_API_TOKEN }}
      S4: ${{ secrets.DO_TOKEN }}
      S5: ${{ secrets.DIGITALOCEAN_API_TOKEN }}
      S6: ${{ secrets.DO_ACCESS_TOKEN }}
    steps:
      - name: Report credential presence only
        shell: bash
        run: |
          for n in 1 2 3 4 5 6; do
            v="S$n"
            if [ -n "${!v}" ]; then echo "$v=yes"; else echo "$v=no"; fi
          done
