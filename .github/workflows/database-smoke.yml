name: Database integration checks

on:
  push:
    branches: [main, fix/database-readiness-20261105]
    paths:
      - server.js
      - migrations/**
      - scripts/apply-db-repair.cjs
      - scripts/test-directory-db.cjs
      - .github/workflows/database-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-local-database-only
          POSTGRES_DB: mentalhu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d mentalhu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci-local-database-only@127.0.0.1:5432/mentalhu_test
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply deterministic scaffold repair
        run: node scripts/apply-db-repair.cjs
      - name: Validate JavaScript syntax
        run: |
          node --check server.js
          node --check scripts/test-directory-db.cjs
          node --check directory.js
      - name: Install locked dependencies
        run: npm ci
      - name: Test real database, pages, admin and unavailable database
        run: node scripts/test-directory-db.cjs
      - name: Save tested changes on the repair branch only
        if: github.ref == 'refs/heads/fix/database-readiness-20261105'
        run: |
          if git diff --quiet -- server.js migrations/003_public_seed.sql; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js migrations/003_public_seed.sql
          git commit -m 'Fix seeded data and database readiness after PostgreSQL integration tests'
          git push origin HEAD:fix/database-readiness-20261105
      - name: Ensure tracked repair is current on main
        if: github.ref == 'refs/heads/main'
        run: git diff --exit-code -- server.js migrations/003_public_seed.sql
