name: Directory and contact regression checks
on:
  push:
    branches: [main, 'release/expanded-31-*', 'feature/articles-*', 'feature/admin-statistics-*', 'feature/provider-*']
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: mentalhu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d mentalhu_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci-local-only@127.0.0.1:5432/mentalhu_test
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm}
      - run: npm ci
      - name: Validate runtime syntax
        run: |
          node --check server.js
          node --check lib/contact-inquiries.cjs
          node --check lib/public-catalog.cjs
          node --check contact.js
          node --check admin/contact-admin.js
          node --check mental.js
          node --test scripts/test-home-editorial.cjs
          node --check lib/site-statistics.cjs
          node --check statistics.js
          node --check admin/statistics-admin.js
          node --test scripts/test-site-statistics.cjs scripts/test-related-providers.cjs
      - name: Verify provider accounts, profiles and recoverable trash
        run: |
          node --check lib/provider-accounts.cjs
          node --check lib/provider-profiles.cjs
          node --check lib/directory-submissions.cjs
          node --check lib/submission-notifications.cjs
          node --check provider-account.js
          node --check admin/admin.js
          node --test scripts/test-provider-accounts.cjs scripts/test-provider-profiles.cjs scripts/test-provider-views.cjs scripts/test-submission-trash.cjs scripts/test-mail-transport.cjs scripts/test-submission-notifications.cjs
          node --test scripts/test-provider-accounts-db.cjs scripts/test-provider-profiles-db.cjs scripts/test-submission-trash-db.cjs scripts/test-submission-notifications-db.cjs
        env:
          TEST_DATABASE_URL: postgresql://ci:ci-local-only@127.0.0.1:5432/mentalhu_test
      - name: Verify every public page and private inquiry lifecycle
        run: node scripts/test-expanded-catalog.cjs
      - name: Verify visitor aggregation and contact statistics
        run: node --test scripts/test-site-statistics-db.cjs
        env:
          TEST_DATABASE_URL: postgresql://ci:ci-local-only@127.0.0.1:5432/mentalhu_test
      - name: Verify MCP authentication, media, drafts and publication
        run: node --test scripts/test-mcp-oauth.cjs scripts/test-mcp-media.cjs scripts/test-mcp-articles.cjs scripts/test-mcp-server.cjs
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
          echo "BROWSER_TOOLS=$RUNNER_TEMP/browser-tools/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Verify native browser OAuth consent and callback
        run: node --test scripts/test-mcp-oauth-browser.cjs
      - name: Verify real browser submission and administrative handling
        run: node scripts/test-contact-browser.cjs
      - name: Verify statistics dashboard and article provider sidebar
        run: node scripts/test-statistics-browser.cjs
      - name: Verify provider invitation, profile publishing and trash in browsers
        run: node scripts/test-provider-browser.cjs
        env:
          TEST_DATABASE_URL: postgresql://ci:ci-local-only@127.0.0.1:5432/mentalhu_test
      - name: Verify articles, approval boundaries and editorial browser flows
        run: |
          node scripts/validate-editorial.cjs
          node --test scripts/test-editorial-import.cjs
          node scripts/test-editorial-import-db.cjs
          node scripts/test-articles.cjs
      - name: Store test summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directory-contact-test-results
          path: |
            release-test-report.json
            browser-test-report.json
            articles-test-report.json
            test-artifacts/
          retention-days: 14
