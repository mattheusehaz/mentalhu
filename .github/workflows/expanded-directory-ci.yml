name: Fast editorial validation
on:
  push:
    branches: ['feature/articles-fast-validate-ai-20261126']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm}
      - run: npm ci
      - name: Validate editorial packages
        run: node scripts/validate-editorial.cjs
