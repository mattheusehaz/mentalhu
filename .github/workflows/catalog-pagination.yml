name: Complete public catalog checks
on:
  push:
    branches: [main, fix/catalog-pagination-20261106]
    paths:
      - server.js
      - index.html
      - lib/public-catalog.cjs
      - catalog-pagination.css
      - catalog-summary.js
      - scripts/apply-catalog-pagination.cjs
      - scripts/test-catalog-pagination.cjs
      - scripts/probe-live-catalog.cjs
      - .github/workflows/catalog-pagination.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-pagination:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-local-database-only
          POSTGRES_DB: mentalhu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d mentalhu_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci-local-database-only@127.0.0.1:5432/mentalhu_test
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply targeted listing repair
        run: node scripts/apply-catalog-pagination.cjs
      - name: Validate syntax
        run: |
          node --check server.js
          node --check lib/public-catalog.cjs
          node --check scripts/test-catalog-pagination.cjs
          node --check catalog-summary.js
      - run: npm ci
      - name: Existing database and CMS regression checks
        run: node scripts/test-directory-db.cjs
      - name: Visit every public listing page and verify all 399 records
        run: node scripts/test-catalog-pagination.cjs
      - name: Read-only public deployment diagnostics
        if: always()
        run: node scripts/probe-live-catalog.cjs
      - name: Commit tested wiring on the repair branch only
        if: success() && github.ref == 'refs/heads/fix/catalog-pagination-20261106'
        run: |
          if git diff --quiet -- server.js index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js index.html
          git commit -m 'Wire tested complete catalog with accurate totals and pagination'
          git push origin HEAD:fix/catalog-pagination-20261106
      - name: Main must already include the tested wiring
        if: github.ref == 'refs/heads/main'
        run: git diff --exit-code -- server.js index.html
