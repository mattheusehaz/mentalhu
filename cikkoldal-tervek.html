n</style></head><body class=\"article-page\"><a class=\"skip-link\" href=\"#cikktorzs\">Ugrás a cikkhez</a><div class=\"reading-progress\" aria-hidden=\"true\"></div><header class=\"topbar\"><a class=\"logo\" href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/\">MENTÁL<span>.hu</span></a><nav class=\"nav\" aria-label=\"Fő navigáció\"><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/#on\">ÖNISMERET</a><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/#kap\">KAPCSOLATOK</a><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/#csalad\">CSALÁD</a><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/#test\">TEST ÉS LÉLEK</a><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/#munka\">MUNKA</a></nav><a class=\"back-link\" href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/\">Vissza a magazinhoz ↗</a></header><main class=\"article-shell\"><nav class=\"breadcrumb\" aria-label=\"Morzsanavigáció\"><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/\">Főoldal</a><span aria-hidden=\"true\">/</span><span>Önismeret</span></nav><article><div class=\"article-heading\"><div class=\"article-kicker\">Önismeret</div><h1>A szorongás nem mindig látványos</h1><p class=\"article-lead\">Van, amikor csendes, mindennapi szokásainkban rejtőzik, és észrevétlenül formálja a napjainkat.</p><div class=\"article-meta\"><strong>Szerző neve</strong><span>·</span><span>Megjelenés dátuma</span><span>·</span><span>3 perc olvasás</span></div><span class=\"sample-label\">Cikkoldalterv · mintaszöveg</span></div><figure class=\"article-cover\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/fresh-1-hq.jpg\" alt=\"A szorongás nem mindig látványos – illusztráció\" fetchpriority=\"high\"><figcaption>Illusztráció · MENTÁL.hu</figcaption></figure><div class=\"article-layout\"><nav class=\"article-outline\" aria-label=\"A cikk tartalma\"><strong>EBBEN AZ ÍRÁSBAN</strong><a href=\"#resz-1\">A csend mögötti történetek</a><a href=\"#resz-2\">Figyelni ítélkezés nélkül</a><a href=\"#resz-3\">Teret adni a beszélgetésnek</a></nav><div class=\"article-body\" id=\"cikktorzs\"><p class=\"opening\">Van, amikor csendes, mindennapi szokásainkban rejtőzik, és észrevétlenül formálja a napjainkat. Egy hétköznapi jelenet néha közelebb visz ehhez a témához, mint egy tökéletesen megfogalmazott válasz. Érdemes megállni annál, ami ismerős benne, és annál is, ami kérdéseket hagy maga után.</p><p>Nem ugyanazt a történetet hozzuk magunkkal. Más tapasztalataink, kapcsolataink és elvárásaink vannak, ezért ugyanaz a helyzet is mást jelenthet mindannyiunknak.</p><h2 id=\"resz-1\">A csend mögötti történetek</h2><p>A beszélgetés kezdődhet egy egészen egyszerű visszaemlékezéssel. Mikor találkoztunk ezzel legutóbb a saját napjainkban? Mi történt akkor, mit mondtunk, és mi maradt kimondatlanul?</p><p>Az ilyen részletek saját szavakat adhatnak ahhoz, amiről eddig csak általánosságban gondolkodtunk. A történetünknek nem kell rögtön tanulsággal végződnie.</p><blockquote>Amit kívülről látunk, nem mond el mindent arról, ami belül történik.</blockquote><h2 id=\"resz-2\">Figyelni ítélkezés nélkül</h2><p>Van, amit szívesen megtartanánk abból, ahogyan eddig éltünk, és van, amit már másként látunk. A kettő megférhet egymás mellett. Nem kell egyetlen mondatban eldöntenünk, hogyan viszonyulunk az egész történethez.</p><p>Egy figyelmes beszélgetésben annak is lehet helye, hogy még nem tudjuk a választ. A másik ember nézőpontja új részleteket mutathat meg, miközben a saját tapasztalatunk is megőrzi a helyét.</p><div class=\"reflection\"><span class=\"small-title\">EGY PILLANAT MAGADRA</span><h3>Mi az, amit ebből magaddal vinnél?</h3><p>Idézz fel egy konkrét pillanatot az elmúlt napokból, amelyhez kapcsolódik ez a téma. Mit mondanál róla most, a saját szavaiddal?</p></div><h2 id=\"resz-3\">Teret adni a beszélgetésnek</h2><p>A folytatás lehet egy későbbi beszélgetés, egy leírt mondat vagy egy új kérdés. Nem szükséges mindent egyszerre lezárni. Néha az is elég, hogy valamit már pontosabban meg tudunk nevezni.</p><div class=\"author-card\"><div class=\"author-symbol\" aria-hidden=\"true\">M</div><div><strong>Szerző neve</strong><p>A szerző bemutatkozása és szakmai háttere itt jelenik meg a végleges cikkben.</p></div></div></div><aside class=\"article-aside\"><p class=\"margin-word\">Kérdések,<br>amik közelebb<br>visznek.</p></aside></div></article><section class=\"article-related\"><div class=\"related-heading\"><h2>Érdemes tovább olvasni</h2><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/#frissen\">Vissza a friss írásokhoz ↗</a></div><div class=\"related-grid\"><a class=\"related-card\" href=\"mit-orokol-tolunk-a-gyermekunk.html\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/fresh-2-hq.jpg\" alt=\"\" loading=\"lazy\"><div class=\"tag\">CSALÁD</div><h3>Mit örököl tőlünk a gyermekünk?</h3><span class=\"time\">Tovább olvasom →</span></a><a class=\"related-card\" href=\"amikor-elfaradunk-egymasban.html\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/fresh-3-hq.jpg\" alt=\"\" loading=\"lazy\"><div class=\"tag\">KAPCSOLATOK</div><h3>Amikor elfáradunk egymásban</h3><span class=\"time\">Tovább olvasom →</span></a><a class=\"related-card\" href=\"hogyan-tudom-megszeretni-magam.html\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/expert-hq.jpg\" alt=\"\" loading=\"lazy\"><div class=\"tag\">SZAKÉRTŐ VÁLASZOL</div><h3>Hogyan tudom megszeretni magam úgy, ahogy vagyok?</h3><span class=\"time\">Tovább olvasom →</span></a></div></section></main><footer class=\"article-footer\"><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/\">MENTÁL.hu</a><p>Jobb emberek. Teljesebb életek.</p></footer><script>const bar=document.querySelector('.reading-progress');function progress(){const end=document.querySelector('.author-card').getBoundingClientRect().bottom+window.scrollY-window.innerHeight;bar.style.transform='scaleX('+Math.max(0,Math.min(1,window.scrollY/Math.max(1  mindig a nagy válaszok hiányoznak. Néha csak arra van szükségünk, hogy végre jól kérdezzünk.</p><div class=\"article-meta\"><strong>Szerző neve</strong><span>·</span><span>Megjelenés dátuma</span><span>·</span><span>3 perc olvasás</span></div><span class=\"sample-label\">Cikkoldalterv · mintaszöveg</span></div><figure class=\"article-cover\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/hero-hq.jpg\" alt=\"Miért olyan nehéz jól lenni? – illusztráció\" fetchpriority=\"high\"><figcaption>Illusztráció · MENTÁL.hu</figcaption></figure><div class=\"article-layout\"><nav class=\"article-outline\" aria-label=\"A cikk tartalma\"><strong>EBBEN AZ ÍRÁSBAN</strong><a href=\"#resz-1\">Mihez mérjük a jóllétünket?</a><a href=\"#resz-2\">Van helye annak is, ami nehéz</a><a href=\"#resz-3\">Egy kérdés a nap végére</a></nav><div class=\"article-body\" id=\"cikktorzs\"><p class=\"opening\">Nem mindig a nagy válaszok hiányoznak. Néha csak arra van szükségünk, hogy végre jól kérdezzünk. Egy hétköznapi jelenet néha közelebb visz ehhez a témához, mint egy tökéletesen megfogalmazott válasz. Érdemes megállni annál, ami ismerős benne, és annál is, ami kérdéseket hagy maga után.</p><p>Nem ugyanazt a történetet hozzuk magunkkal. Más tapasztalataink, kapcsolataink és elvárásaink vannak, ezért ugyanaz a helyzet is mást jelenthet mindannyiunknak.</p><h2 id=\"resz-1\">Mihez mérjük a jóllétünket?</h2><p>A beszélgetés kezdődhet egy egészen egyszerű visszaemlékezéssel. Mikor találkoztunk ezzel legutóbb a saját napjainkban? Mi történt akkor, mit mondtunk, és mi maradt kimondatlanul?</p><p>Az ilyen részletek saját szavakat adhatnak ahhoz, amiről eddig csak általánosságban gondolkodtunk. A történetünknek nem kell rögtön tanulsággal végződnie.</p><blockquote>Nem kell minden napnak bizonyítania, hogy jó irányba tartunk.</blockquote><h2 id=\"resz-2\">Van helye annak is, ami nehéz</h2><p>Van, amit szívesen megtartanánk abból, ahogyan eddig éltünk, és van, amit már másként látunk. A kettő megférhet egymás mellett. Nem kell egyetlen mondatban eldöntenünk, hogyan viszonyulunk az egész történethez.</p><p>Egy figyelmes beszélgetésben annak is lehet helye, hogy még nem tudjuk a választ. A másik ember nézőpontja új részleteket mutathat meg, miközben a saját tapasztalatunk is megőrzi a helyét.</p><div class=\"reflection\"><span class=\"small-title\">EGY PILLANAT MAGADRA</span><h3>Mi az, amit ebből magaddal vinnél?</h3><p>Idézz fel egy konkrét pillanatot az elmúlt napokból, amelyhez kapcsolódik ez a téma. Mit mondanál róla most, a saját szavaiddal?</p></div><h2 id=\"resz-3\">Egy kérdés a nap végére</h2><p>A folytatás lehet egy későbbi beszélgetés, egy leírt mondat vagy egy új kérdés. Nem szükséges mindent egyszerre lezárni. Néha az is elég, hogy valamit már pontosabban meg tudunk nevezni.</p><div class=\"author-card\"><div class=\"author-symbol\" aria-hidden=\"true\">M</div><div><strong>Szerző neve</strong><p>A szerző bemutatkozása és szakmai háttere itt jelenik meg a végleges cikkben.</p></div></div></div><aside class=\"article-aside\"><p class=\"margin-word\">Kérdések,<br>amik közelebb<br>visznek.</p></aside></div></article><section class=\"article-related\"><div class=\"related-heading\"><h2>Érdemes tovább olvasni</h2><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/#frissen\">Vissza a friss írásokhoz ↗</a></div><div class=\"related-grid\"><a class=\"related-card\" href=\"a-szorongas-nem-mindig-latvanyos.html\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/fresh-1-hq.jpg\" alt=\"\" loading=\"lazy\"><div class=\"tag\">ÖNISMERET</div><h3>A szorongás nem mindig látványos</h3><span class=\"time\">Tovább olvasom →</span></a><a class=\"related-card\" href=\"mit-orokol-tolunk-a-gyermekunk.html\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/fresh-2-hq.jpg\" alt=\"\" loading=\"lazy\"><div class=\"tag\">CSALÁD</div><h3>Mit örököl tőlünk a gyermekünk?</h3><span class=\"time\">Tovább olvasom →</span></a><a class=\" n.app/#kap\">KAPCSOLATOK</a><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/#csalad\">CSALÁD</a><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/#test\">TEST ÉS LÉLEK</a><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/#munka\">MUNKA</a></nav><a class=\"back-link\" href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/\">Vissza a magazinhoz ↗</a></header><main class=\"article-shell\"><nav class=\"breadcrumb\" aria-label=\"Morzsanavigáció\"><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/\">Főoldal</a><span aria-hidden=\"true\">/</span><span>Család</span></nav><article><div class=\"article-heading\"><div class=\"article-kicker\">Család</div><h1>Mit örököl tőlünk a gyermekünk?</h1><p class=\"article-lead\">A közös történeteinkben ott vannak a kimondott mondatok és azok is, amelyeket csak a gesztusainkkal adunk tovább.</p><div class=\"article-meta\"><strong>Szerző neve</strong><span>·</span><span>Megjelenés dátuma</span><span>·</span><span>3 perc olvasás</span></div><span class=\"sample-label\">Cikkoldalterv · mintaszöveg</span></div><figure class=\"article-cover\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/fresh-2-hq.jpg\" alt=\"Mit örököl tőlünk a gyermekünk? – illusztráció\" fetchpriority=\"high\"><figcaption>Illusztráció · MENTÁL.hu</figcaption></figure><div class=\"article-layout\"><nav class=\"article-outline\" aria-label=\"A cikk tartalma\"><strong>EBBEN AZ ÍRÁSBAN</strong><a href=\"#resz-1\">A hétköznapok apró mintái</a><a href=\"#resz-2\">Amit szeretnénk továbbadni</a><a href=\"#resz-3\">Egy közös pillanat</a></nav><div class=\"article-body\" id=\"cikktorzs\"><p class=\"opening\">A közös történeteinkben ott vannak a kimondott mondatok és azok is, amelyeket csak a gesztusainkkal adunk tovább. Egy hétköznapi jelenet néha közelebb visz ehhez a témához, mint egy tökéletesen megfogalmazott válasz. Érdemes megállni annál, ami ismerős benne, és annál is, ami kérdéseket hagy maga után.</p><p>Nem ugyanazt a történetet hozzuk magunkkal. Más tapasztalataink, kapcsolataink és elvárásaink vannak, ezért ugyanaz a helyzet is mást jelenthet mindannyiunknak.</p><h2 id=\"resz-1\">A hétköznapok apró mintái</h2><p>A beszélgetés kezdődhet egy egészen egyszerű visszaemlékezéssel. Mikor találkoztunk ezzel legutóbb a saját napjainkban? Mi történt akkor, mit mondtunk, és mi maradt kimondatlanul?</p><p>Az ilyen részletek saját szavakat adhatnak ahhoz, amiről eddig csak általánosságban gondolkodtunk. A történetünknek nem kell rögtön tanulsággal végződnie.</p><blockquote>Néha egy figyelmesen végighallgatott történet lesz a nap legfontosabb öröksége.</blockquote><h2 id=\"resz-2\">Amit szeretnénk továbbadni</h2><p>Van, amit szívesen megtartanánk abból, ahogyan eddig éltünk, és van, amit már másként látunk. A kettő megférhet egymás mellett. Nem kell egyetlen mondatban eldöntenünk, hogyan viszonyulunk az egész történethez.</p><p>Egy figyelmes beszélgetésben annak is lehet helye, hogy még nem tudjuk a választ. A másik ember nézőpontja új részleteket mutathat meg, miközben a saját tapasztalatunk is megőrzi a helyét.</p><div class=\"reflection\"><span class=\"small-title\">EGY PILLANAT MAGADRA</span><h3>Mi az, amit ebből magaddal vinnél?</h3><p>Idézz fel egy konkrét pillanatot az elmúlt napokból, amelyhez kapcsolódik ez a téma. Mit mondanál róla most, a saját szavaiddal?</p></div><h2 id=\"resz-3\">Egy közös pillanat</h2><p>A folytatás lehet egy későbbi beszélgetés, egy leírt mondat vagy egy új kérdés. Nem szükséges mindent egyszerre lezárni. Néha az is elég, hogy valamit már pontosabban meg tudunk nevezni.</p><div class=\"author-card\"><div class=\"author-symbol\" aria-hidden=\"true\">M</div><div><strong>Szerző neve</strong><p>A szerző bemutatkozása és szakmai háttere itt jelenik meg a végleges cikkben.</p></div></div></div><aside class=\"article-aside\"><p class=\"margin-word\">Kérdések,<br>amik közelebb<br>visznek.</p></aside></div></article><section class=\"article-related\"><div class=\"related-heading\"><h2>Érdemes tovább olvasni</h2><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/#frissen\">Vissza a friss írásokhoz ↗</a></div><div class=\"related-grid\"><a class=\"related-card\" href=\"amikor-elfaradunk-egymasban.html\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/fresh-3-hq.jpg\" alt=\"\" loading=\"lazy\"><div class=\"tag\">KAPCSOLATOK</div><h3>Amikor elfáradunk egymásban</h3><span class=\"time\">Tovább olvasom →</span></a><a class=\"related-card\" href=\"hogyan-tudom-megszeretni-magam.html\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/expert-hq.jpg\" alt=\"\" loading=\"lazy\"><div class=\"tag\">SZAKÉRTŐ VÁLASZOL</div><h3>Hogyan tudom megszeretni magam úgy, ahogy vagyok?</h3><span class=\"time\">Tovább olvasom →</span></a><a class=\"related-card\" href=\"lassulas-ami-tenyleg-feltolt.html\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/rec-1-hq.jpg\" alt=\"\" loading=\"lazy\"><div class=\"tag\">TEST ÉS LÉLEK</div><h3>Lassulás, ami tényleg feltölt</h3><span class=\"time\">Tovább olvasom →</span></a></div></section></main><footer class=\"article-footer\"><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/\">MENTÁL.hu</a><p>Jobb emberek. Teljesebb életek.</p></footer><script>const bar=document.querySelector('.reading-progress');function progress(){const end=document.querySelector('.author-card').getBoundingClientRect().bottom+window.scrollY-window.innerHeight;bar.style.transform='scaleX('+Math.max(0,Math.min(1,window.scrollY/Math.max(1,end)))+')';}addEventListener('scroll',progress,{passive:true});addEventListener('resize',progress);progress();<\/script><script>document.addEventListener(\"click\",function(e){const a=e.target.closest(\"a\");if(a && a.getAttribute(\"href\").endsWith(\".html\")){e.preventDefault();parent.postMessage({article:a.getAttribute(\"href\")},\"*\");}});<\/script></body></html>", "amikor-elfaradunk-egymasban.html": "<!doctype html><html lang=\"hu\"><he pg\" alt=\"Amikor elfáradunk egymásban – illusztráció\" fetchpriority=\"high\"><figcaption>Illusztráció · MENTÁL.hu</figcaption></figure><div class=\"article-layout\"><nav class=\"article-outline\" aria-label=\"A cikk tartalma\"><strong>EBBEN AZ ÍRÁSBAN</strong><a href=\"#resz-1\">Amikor csak a teendők maradnak</a><a href=\"#resz-2\">Kérdések a kész válaszok helyett</a><a href=\"#resz-3\">Idő egymásra</a></nav><div class=\"article-body\" id=\"cikktorzs\"><p class=\"opening\">Közelség, őszinteség, újrakezdés. Hogyan beszéljünk arról, ami két ember között lassan kimondatlanná válik? Egy hétköznapi jelenet néha közelebb visz ehhez a témához, mint egy tökéletesen megfogalmazott válasz. Érdemes megállni annál, ami ismerős benne, és annál is, ami kérdéseket hagy maga után.</p><p>Nem ugyanazt a történetet hozzuk magunkkal. Más tapasztalataink, kapcsolataink és elvárásaink vannak, ezért ugyanaz a helyzet is mást jelenthet mindannyiunknak.</p><h2 id=\"resz-1\">Amikor csak a teendők maradnak</h2><p>A beszélgetés kezdődhet egy egészen egyszerű visszaemlékezéssel. Mikor találkoztunk ezzel legutóbb a saját napjainkban? Mi történt akkor, mit mondtunk, és mi maradt kimondatlanul?</p><p>Az ilyen részletek saját szavakat adhatnak ahhoz, amiről eddig csak általánosságban gondolkodtunk. A történetünknek nem kell rögtön tanulsággal végződnie.</p><blockquote>Mikor kérdeztük meg egymást utoljára úgy, hogy a válaszra is maradt idő?</blockquote><h2 id=\"resz-2\">Kérdések a kész válaszok helyett</h2><p>Van, amit szívesen megtartanánk abból, ahogyan eddig éltünk, és van, amit már másként látunk. A kettő megférhet egymás mellett. Nem kell egyetlen mondatban eldöntenünk, hogyan viszonyulunk az egész történethez.</p><p>Egy figyelmes beszélgetésben annak is lehet helye, hogy még nem tudjuk a választ. A másik ember nézőpontja új részleteket mutathat meg, miközben a saját tapasztalatunk is megőrzi a helyét.</p><div class=\"reflection\"><span class=\"small-title\">EGY PILLANAT MAGADRA</span><h3>Mi az, amit ebből magaddal vinnél?</h3><p>Idézz fel egy konkrét pillanatot az elmúlt napokból, amelyhez kapcsolódik ez a téma. Mit mondanál róla most, a saját szavaiddal?</p></div><h2 id=\"resz-3\">Idő egymásra</h2><p>A folytatás lehet egy későbbi beszélgetés, egy leírt mondat vagy egy új kérdés. Nem szükséges mindent egyszerre lezárni. Néha az is elég, hogy valamit már pontosabban meg tudunk nevezni.</p><div class=\"author-card\"><div class=\"author-symbol\" aria-hidden=\"true\">M</div><div><strong>Szerző neve</strong><p>A szerző bemutatkozása és szakmai háttere itt jelenik meg a végleges cikkben.</p></div></div></div><aside class=\"article-aside\"><p class=\"margin-word\">Kérdések,<br>amik közelebb<br>visznek.</p></aside></div></article><section class=\"article-related\"><div class=\"related-heading\"><h2>Érdemes tovább olvasni</h2><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/#frissen\">Vissza a friss írásokhoz ↗</a></div><div class=\"related-grid\"><a class=\"related-card\" href=\"hogyan-tudom-megszeretni-magam.html\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/expert-hq.jpg\" alt=\"\" loading=\"lazy\"><div class=\"tag\">SZAKÉRTŐ VÁLASZOL</div><h3>Hogyan tudom megszeretni magam úgy, ahogy vagyok?</h3><span class=\"time\">Tovább olvasom →</span></a><a class=\"related-card\" href=\"lassulas-ami-tenyleg-feltolt.html\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/rec-1-hq.jpg\" alt=\"\" loading=\"lazy\"><div class=\"tag\">TEST ÉS LÉLEK</div><h3>Lassulás, ami tényleg feltölt</h3><span class=\"time\">Tovább olvasom →</span></a><a class=\"related-card\" href=\"kieges-helyett-ertelmes-munka.html\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/rec-2-hq.jpg\" alt=\"\" loading=\"lazy\"><div class=\"tag\">MUNKA</div><h3>Kiégés helyett: értelmes munka és reális elvárások</h3><span class=\"time\">Tovább olvasom →</span></a></div></section></main><footer class=\"article-footer\"><a href=\"https://hammerhea ↗</a></header><main class=\"article-shell\"><nav class=\"breadcrumb\" aria-label=\"Morzsanavigáció\"><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/\">Főoldal</a><span aria-hidden=\"true\">/</span><span>Test és lélek</span></nav><article><div class=\"article-heading\"><div class=\"article-kicker\">Test és lélek</div><h1>Lassulás, ami tényleg feltölt</h1><p class=\"article-lead\">Egy könyv, egy csésze tea, egy szabad délután. Mit jelent számunkra az az idő, amelynek nem kell eredményt hoznia?</p><div class=\"article-meta\"><strong>Szerző neve</strong><span>·</span><span>Megjelenés dátuma</span><span>·</span><span>3 perc olvasás</span></div><span class=\"sample-label\">Cikkoldalterv · mintaszöveg</span></div><figure class=\"article-cover\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/rec-1-hq.jpg\" alt=\"Lassulás, ami tényleg feltölt – illusztráció\" fetchpriority=\"high\"><figcaption>Illusztráció · MENTÁL.hu</figcaption></figure><div class=\"article-layout\"><nav class=\"article-outline\" aria-label=\"A cikk tartalma\"><strong>EBBEN AZ ÍRÁSBAN</strong><a href=\"#resz-1\">A szabad idő nem üres idő</a><a href=\"#resz-2\">Mitől lesz a pihenés a miénk?</a><a href=\"#resz-3\">Egy délután terve</a></nav><div class=\"article-body\" id=\"cikktorzs\"><p class=\"opening\">Egy könyv, egy csésze tea, egy szabad délután. Mit jelent számunkra az az idő, amelynek nem kell eredményt hoznia? Egy hétköznapi jelenet néha közelebb visz ehhez a témához, mint egy tökéletesen megfogalmazott válasz. Érdemes megállni annál, ami ismerős benne, és annál is, ami kérdéseket hagy maga után.</p><p>Nem ugyanazt a történetet hozzuk magunkkal. Más tapasztalataink, kapcsolataink és elvárásaink vannak, ezért ugyanaz a helyzet is mást jelenthet mindannyiunknak.</p><h2 id=\"resz-1\">A szabad idő nem üres idő</h2><p>A beszélgetés kezdődhet egy egészen egyszerű visszaemlékezéssel. Mikor találkoztunk ezzel legutóbb a saját napjainkban? Mi történt akkor, mit mondtunk, és mi maradt kimondatlanul?</p><p>Az ilyen részletek saját szavakat adhatnak ahhoz, amiről eddig csak általánosságban gondolkodtunk. A történetünknek nem kell rögtön tanulsággal végződnie.</p><blockquote>Nem minden értékes pillanatból lesz kipipálható feladat.</blockquote><h2 id=\"resz-2\">Mitől lesz a pihenés a miénk?</h2><p>Van, amit szívesen megtartanánk abból, ahogyan eddig éltünk, és van, amit már másként látunk. A kettő megférhet egymás mellett. Nem kell egyetlen mondatban eldöntenünk, hogyan viszonyulunk az egész történethez.</p><p>Egy figyelmes beszélgetésben annak is lehet helye, hogy még nem tudjuk a választ. A másik ember nézőpontja új részleteket mutathat meg, miközben a saját tapasztalatunk is megőrzi a helyét.</p><div class=\"reflection\"><span class=\"small-title\">EGY PILLANAT MAGADRA</span><h3>Mi az, amit ebből magaddal vinnél?</h3><p>Idézz fel egy konkrét pillanatot az elmúlt napokból, amelyhez kapcsolódik ez a téma. Mit mondanál róla most, a saját szavaiddal?</p></div><h2 id=\"resz-3\">Egy délután terve</h2><p>A folytatás lehet egy későbbi beszélgetés, egy leírt mondat vagy egy új kérdés. Nem szükséges mindent egyszerre lezárni. Néha az is elég, hogy valamit már pontosabban meg tudunk nevezni.</p><div class=\"author-card\"><div class=\"author-symbol\" aria-hidden=\"true\">M</div><div><strong>Szerző neve</strong><p>A szerző bemutatkozása és szakmai háttere itt jelenik meg a végleges cikkben.</p></div></div></div><aside class=\"article-aside\"><p class=\"margin-word\">Kérdések,<br>amik közelebb<br>visznek.</p></aside></div></article><section class=\"article-related\"><div class=\"related-heading\"><h2>Érdemes tovább olvasni</h2><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/#frissen\">Vissza a friss írásokhoz ↗</a></div><div class=\"related-grid\"><a class=\"related-card\" href=\"kieges-helyett-ertelmes-munka.html\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/rec-2-hq.jpg\" alt=\"\" loading=\"lazy\"><div class=\"tag\">MUNKA< ><a class=\"skip-link\" href=\"#cikktorzs\">Ugrás a cikkhez</a><div class=\"reading-progress\" aria-hidden=\"true\"></div><header class=\"topbar\"><a class=\"logo\" href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/\">MENTÁL<span>.hu</span></a><nav class=\"nav\" aria-label=\"Fő navigáció\"><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/#on\">ÖNISMERET</a><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/#kap\">KAPCSOLATOK</a><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/#csalad\">CSALÁD</a><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/#test\">TEST ÉS LÉLEK</a><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/#munka\">MUNKA</a></nav><a class=\"back-link\" href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/\">Vissza a magazinhoz ↗</a></header><main class=\"article-shell\"><nav class=\"breadcrumb\" aria-label=\"Morzsanavigáció\"><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/\">Főoldal</a><span aria-hidden=\"true\">/</span><span>Szakértő válaszol</span></nav><article><div class=\"question-layout\"><div class=\"article-heading\"><div class=\"article-kicker\">Szakértő válaszol</div><h1>Hogyan tudom megszeretni magam úgy, ahogy vagyok?</h1><p class=\"article-lead\">Egy olvasói kérdés az önmagunkkal folytatott párbeszédről, a türelemről és az elvárásainkról.</p><div class=\"article-meta\"><strong>Szerző neve</strong><span>·</span><span>Megjelenés dátuma</span><span>·</span><span>3 perc olvasás</span></div><span class=\"sample-label\">Cikkoldalterv · mintaszöveg</span></div><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/expert-hq.jpg\" alt=\"Illusztratív portré a szakértői rovat oldalához\" width=\"1448\" height=\"1086\"></div><div class=\"article-layout\"><nav class=\"article-outline\" aria-label=\"A cikk tartalma\"><strong>EBBEN AZ ÍRÁSBAN</strong><a href=\"#resz-1\">Milyen hangon beszélünk magunkhoz?</a><a href=\"#resz-2\">Elvárások és saját szempontok</a><a href=\"#resz-3\">Egy gondolat útravalónak</a></nav><div class=\"article-body\" id=\"cikktorzs\"><div class=\"question-box\"><span class=\"small-title\">AZ OLVASÓ KÉRDÉSE</span><p>„Másokkal könnyen vagyok megértő, magammal viszont sokszor szigorú. Hogyan indulhatnék el egy másfajta párbeszéd felé?”</p></div><p class=\"opening\">Egy olvasói kérdés az önmagunkkal folytatott párbeszédről, a türelemről és az elvárásainkról. Egy hétköznapi jelenet néha közelebb visz ehhez a témához, mint egy tökéletesen megfogalmazott válasz. Érdemes megállni annál, ami ismerős benne, és annál is, ami kérdéseket hagy maga után.</p><p>Nem ugyanazt a történetet hozzuk magunkkal. Más tapasztalataink, kapcsolataink és elvárásaink vannak, ezért ugyanaz a helyzet is mást jelenthet mindannyiunknak.</p><h2 id=\"resz-1\">Milyen hangon beszélünk magunkhoz?</h2><p>A beszélgetés kezdődhet egy egészen egyszerű visszaemlékezéssel. Mikor találkoztunk ezzel legutóbb a saját napjainkban? Mi történt akkor, mit mondtunk, és mi maradt kimondatlanul?</p><p>Az ilyen részletek saját szavakat adhatnak ahhoz, amiről eddig csak általánosságban gondolkodtunk. A történetünknek nem kell rögtön tanulsággal végződnie.</p><blockquote>A kíváncsiság más kérdéseket tesz fel, mint az ítélkezés.</blockquote><h2 id=\"resz-2\">Elvárások és saját szempontok</h2><p>Van, amit szívesen megtartanánk abból, ahogyan eddig éltünk, és van, amit már másként látunk. A kettő megférhet egymás mellett. Nem kell egyetlen mondatban eldöntenünk, hogyan viszonyulunk az egész történethez.</p><p>Egy figyelmes beszélgetésben annak is lehet helye, hogy még nem tudjuk a választ. A másik ember nézőpontja új részleteket mutathat meg, miközben a saját tapasztalatunk is megőrzi a helyét.</p><div class=\"reflection\"><span class=\"small-title\">EGY PILLANAT MAGADRA</span><h3>Mi az, amit ebből magaddal vinnél?</h3><p>Idézz fel egy konkrét pillanatot az elmúlt napokból, amelyhez kapcsolódik ez a téma. Mit mondanál róla most, a saját szavaiddal?</p></div><h2 id=\"resz-3\">Egy gondolat útravalónak</h2><p>A folytatás lehet egy későbbi beszélgetés, egy leírt mondat vagy egy új kérdés. Nem szükséges mindent egyszerre lezárni. Néha az is elég, hogy valamit már pontosabban meg tudunk nevezni.</p><div class=\"author-card\"><div class=\"author-symbol\" aria-hidden=\"true\">M</div><div><strong>Szerző neve</strong><p>A szerző bemutatkozása és szakmai háttere itt jelenik meg a végleges cikkben.</p></div></div></div><aside class=\"article-aside\"><p class=\"margin-word\">Kérdések,<br>amik közelebb<br>visznek.</p></aside></div></article><section class=\"article-related\"><div class=\"related-heading\"><h2>Érdemes tovább olvasni</h2><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/#frissen\">Vissza a friss írásokhoz ↗</a></div><div class=\"related-grid\"><a class=\"related-card\" href=\"lassulas-ami-tenyleg-feltolt.html\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/rec-1-hq.jpg\" alt=\"\" loading=\"lazy\"><div class=\"tag\">TEST ÉS LÉLEK</div><h3>Lassulás, ami tényleg feltölt</h3><span class=\"time\">Tovább olvasom →</span></a><a class=\"related-card\" href=\"kieges-helyett-ertelmes-munka.html\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/rec-2-hq.jpg\" alt=\"\" loading=\"lazy\"><div class=\"tag\">MUNKA</div><h3>Kiégés helyett: értelmes munka és reális elvárások</h3><span class=\"time\">Tovább olvasom →</span></a><a class=\"related-card\" href=\"az-eletkozepi-fordulopont.html\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/rec-3-hq.jpg\" alt=\"\" loading=\"lazy\"><div class=\"tag\">ÖNISMERET</div><h3>Az életközepi fordulópont – válság vagy lehetőség?</h3><span class=\"time\">Tovább olvasom →</span></a></div></section></main><footer class=\"article-footer\"><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/\">MENTÁL.hu</a><p>Jobb emberek. Teljesebb életek.</p></footer><script>const bar=document.querySelector('.reading-progress');function progress(){const end=document.querySele k</span></nav><article><div class=\"article-heading\"><div class=\"article-kicker\">Kapcsolatok</div><h1>Hála a kapcsolatainkban</h1><p class=\"article-lead\">A természetesnek vett gesztusoktól a kimondott köszönetig: történetek arról, mit veszünk észre egymásból.</p><div class=\"article-meta\"><strong>Szerző neve</strong><span>·</span><span>Megjelenés dátuma</span><span>·</span><span>3 perc olvasás</span></div><span class=\"sample-label\">Cikkoldalterv · mintaszöveg</span></div><figure class=\"article-cover\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/rec-4-hq.jpg\" alt=\"Hála a kapcsolatainkban – illusztráció\" fetchpriority=\"high\"><figcaption>Illusztráció · MENTÁL.hu</figcaption></figure><div class=\"article-layout\"><nav class=\"article-outline\" aria-label=\"A cikk tartalma\"><strong>EBBEN AZ ÍRÁSBAN</strong><a href=\"#resz-1\">A hétköznapi figyelmesség</a><a href=\"#resz-2\">A köszönet saját szavai</a><a href=\"#resz-3\">Valami, amit ma kimondhatunk</a></nav><div class=\"article-body\" id=\"cikktorzs\"><p class=\"opening\">A természetesnek vett gesztusoktól a kimondott köszönetig: történetek arról, mit veszünk észre egymásból. Egy hétköznapi jelenet néha közelebb visz ehhez a témához, mint egy tökéletesen megfogalmazott válasz. Érdemes megállni annál, ami ismerős benne, és annál is, ami kérdéseket hagy maga után.</p><p>Nem ugyanazt a történetet hozzuk magunkkal. Más tapasztalataink, kapcsolataink és elvárásaink vannak, ezért ugyanaz a helyzet is mást jelenthet mindannyiunknak.</p><h2 id=\"resz-1\">A hétköznapi figyelmesség</h2><p>A beszélgetés kezdődhet egy egészen egyszerű visszaemlékezéssel. Mikor találkoztunk ezzel legutóbb a saját napjainkban? Mi történt akkor, mit mondtunk, és mi maradt kimondatlanul?</p><p>Az ilyen részletek saját szavakat adhatnak ahhoz, amiről eddig csak általánosságban gondolkodtunk. A történetünknek nem kell rögtön tanulsággal végződnie.</p><blockquote>A köszönet attól lesz személyes, hogy pontosan megnevezzük, mit kaptunk.</blockquote><h2 id=\"resz-2\">A köszönet saját szavai</h2><p>Van, amit szívesen megtartanánk abból, ahogyan eddig éltünk, és van, amit már másként látunk. A kettő megférhet egymás mellett. Nem kell egyetlen mondatban eldöntenünk, hogyan viszonyulunk az egész történethez.</p><p>Egy figyelmes beszélgetésben annak is lehet helye, hogy még nem tudjuk a választ. A másik ember nézőpontja új részleteket mutathat meg, miközben a saját tapasztalatunk is megőrzi a helyét.</p><div class=\"reflection\"><span class=\"small-title\">EGY PILLANAT MAGADRA</span><h3>Mi az, amit ebből magaddal vinnél?</h3><p>Idézz fel egy konkrét pillanatot az elmúlt napokból, amelyhez kapcsolódik ez a téma. Mit mondanál róla most, a saját szavaiddal?</p></div><h2 id=\"resz-3\">Valami, amit ma kimondhatunk</h2><p>A folytatás lehet egy későbbi beszélgetés, egy leírt mondat vagy egy új kérdés. Nem szükséges mindent egyszerre lezárni. Néha az is elég, hogy valamit már pontosabban meg tudunk nevezni.</p><div class=\"author-card\"><div class=\"author-symbol\" aria-hidden=\"true\">M</div><div><strong>Szerző neve</strong><p>A szerző bemutatkozása és szakmai háttere itt jelenik meg a végleges cikkben.</p></div></div></div><aside class=\"article-aside\"><p class=\"margin-word\">Kérdések,<br>amik közelebb<br>visznek.</p></aside></div></article><section class=\"article-related\"><div class=\"related-heading\"><h2>Érdemes tovább olvasni</h2><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/#frissen\">Vissza a friss írásokhoz ↗</a></div><div class=\"related-grid\"><a class=\"related-card\" href=\"miert-olyan-nehez-jol-lenni.html\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/hero-hq.jpg\" alt=\"\" loading=\"lazy\"><div class=\"tag\">ÖNISMERET</div><h3>Miért olyan nehéz jól lenni?</h3><span class=\"time\">Tovább olvasom →</span></a><a class=\"related-card\" href=\"a-szorongas-nem-mindig-latvanyos.html\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/fresh-1-hq.jpg\" alt=\"\" loading=\"lazy\"><div class=\"tag\">ÖNISMERET</div><h3>A szorongás nem mindig látványos</h3><span class=\"time\">Tovább olvasom →</span></a><a class=\"related-card\" href=\"mit-orokol-tolunk-a-gyermekunk.html\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/fresh-2-hq.jpg\" alt=\"\" loading=\"lazy\"><div class=\"tag\">CSALÁD</div><h3>Mit örököl tőlünk a gyermekünk?</h3><span class=\"time\">Tovább olvasom →</span></a></div></section></main><footer class=\"article-footer\"><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/\">MENTÁL.hu</a><p>Jobb emberek. Teljesebb életek.</p></footer><script>const bar=document.querySelector('.reading-progress');function progress(){const end=document.querySelector('.author-card').getBoundingClientRect().bottom+window.scrollY-window.innerHeight;bar.style.transform='scaleX('+Math.max(0,Math.min(1,window.scrollY/Math.max(1,end)))+')';}addEventListener('scroll',progress,{passive:true});addEventListener('resize',progress);progress();<\/script><script>document.addEventListener(\"click\",function(e){const a=e.target.closest(\"a\");if(a && a.getAttribute(\"href\").endsWith(\".html\")){e.preventDefault();parent.postMessage({article:a.getAttribute(\"href\")},\"*\");}});<\/script></body></html>", "az-eletkozepi-fordulopont.html": "<!doctype html><html lang=\"hu\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"robots\" content=\"noindex,nofollow\"><meta name=\"description\" content=\"Amikor újra felmerülnek a kérdések arról, mi fontos, mit vinnénk tovább, és minek engednénk el a helyét.\"><title>Az életközepi fordulópont – válság vagy lehetőség? – MENTÁL.hu</title><style>:root{--ink:#0d2b24;--red:#b84b34;--paper:#f6f3ed;--muted:#6a6f6b;--sage:#dfe5d5}\n*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f9f7f2;color:#202522;font-family:Arial,Helvetica,sans-serif}.topbar{height:74px;display:flex;align-items n></a><nav class=\"nav\" aria-label=\"Fő navigáció\"><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/#on\">ÖNISMERET</a><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/#kap\">KAPCSOLATOK</a><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/#csalad\">CSALÁD</a><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/#test\">TEST ÉS LÉLEK</a><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/#munka\">MUNKA</a></nav><a class=\"back-link\" href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/\">Vissza a magazinhoz ↗</a></header><main class=\"article-shell\"><nav class=\"breadcrumb\" aria-label=\"Morzsanavigáció\"><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/\">Főoldal</a><span aria-hidden=\"true\">/</span><span>Önismeret</span></nav><article><div class=\"article-heading\"><div class=\"article-kicker\">Önismeret</div><h1>Az életközepi fordulópont – válság vagy lehetőség?</h1><p class=\"article-lead\">Amikor újra felmerülnek a kérdések arról, mi fontos, mit vinnénk tovább, és minek engednénk el a helyét.</p><div class=\"article-meta\"><strong>Szerző neve</strong><span>·</span><span>Megjelenés dátuma</span><span>·</span><span>3 perc olvasás</span></div><span class=\"sample-label\">Cikkoldalterv · mintaszöveg</span></div><figure class=\"article-cover\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/rec-3-hq.jpg\" alt=\"Az életközepi fordulópont – válság vagy lehetőség? – illusztráció\" fetchpriority=\"high\"><figcaption>Illusztráció · MENTÁL.hu</figcaption></figure><div class=\"article-layout\"><nav class=\"article-outline\" aria-label=\"A cikk tartalma\"><strong>EBBEN AZ ÍRÁSBAN</strong><a href=\"#resz-1\">Visszanézni a saját történetünkre</a><a href=\"#resz-2\">Ami ma fontos</a><a href=\"#resz-3\">Helyet hagyni a folytatásnak</a></nav><div class=\"article-body\" id=\"cikktorzs\"><p class=\"opening\">Amikor újra felmerülnek a kérdések arról, mi fontos, mit vinnénk tovább, és minek engednénk el a helyét. Egy hétköznapi jelenet néha közelebb visz ehhez a témához, mint egy tökéletesen megfogalmazott válasz. Érdemes megállni annál, ami ismerős benne, és annál is, ami kérdéseket hagy maga után.</p><p>Nem ugyanazt a történetet hozzuk magunkkal. Más tapasztalataink, kapcsolataink és elvárásaink vannak, ezért ugyanaz a helyzet is mást jelenthet mindannyiunknak.</p><h2 id=\"resz-1\">Visszanézni a saját történetünkre</h2><p>A beszélgetés kezdődhet egy egészen egyszerű visszaemlékezéssel. Mikor találkoztunk ezzel legutóbb a saját napjainkban? Mi történt akkor, mit mondtunk, és mi maradt kimondatlanul?</p><p>Az ilyen részletek saját szavakat adhatnak ahhoz, amiről eddig csak általánosságban gondolkodtunk. A történetünknek nem kell rögtön tanulsággal végződnie.</p><blockquote>A folytatásnak nem kell az első fejezetet megismételnie.</blockquote><h2 id=\"resz-2\">Ami ma fontos</h2><p>Van, amit szívesen megtartanánk abból, ahogyan eddig éltünk, és van, amit már másként látunk. A kettő megférhet egymás mellett. Nem kell egyetlen mondatban eldöntenünk, hogyan viszonyulunk az egész történethez.</p><p>Egy figyelmes beszélgetésben annak is lehet helye, hogy még nem tudjuk a választ. A másik ember nézőpontja új részleteket mutathat meg, miközben a saját tapasztalatunk is megőrzi a helyét.</p><div class=\"reflection\"><span class=\"small-title\">EGY PILLANAT MAGADRA</span><h3>Mi az, amit ebből magaddal vinnél?</h3><p>Idézz fel egy konkrét pillanatot az elmúlt napokból, amelyhez kapcsolódik ez a téma. Mit mondanál róla most, a saját szavaiddal?</p></div><h2 id=\"resz-3\">Helyet hagyni a folytatásnak</h2><p>A folytatás lehet egy későbbi beszélgetés, egy leírt mondat vagy egy új kérdés. Nem szükséges mindent egyszerre lezárni. Néha az is elég, hogy valamit már pontosabban meg tudunk nevezni.</p><div class=\"author-card\"><div class=\"author-symbol\" aria-hidden=\"true\">M</div><div><strong>Szerző neve</strong><p>A szerző bemutatkozása és szakmai háttere itt jelenik meg a végleges cikkben.</p></div></div></div><aside class=\"article-aside\"><p class=\"margin-word\">Kérdések,<br>amik közelebb<br>visznek.</p></aside></div></article><section class=\"article-related\"><div class=\"related-heading\"><h2>Érdemes tovább olvasni</h2><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/#frissen\">Vissza a friss írásokhoz ↗</a></div><div class=\"related-grid\"><a class=\"related-card\" href=\"hala-a-kapcsolatainkban.html\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/rec-4-hq.jpg\" alt=\"\" loading=\"lazy\"><div class=\"tag\">KAPCSOLATOK</div><h3>Hála a kapcsolatainkban</h3><span class=\"time\">Tovább olvasom →</span></a><a class=\"related-card\" href=\"miert-olyan-nehez-jol-lenni.html\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/hero-hq.jpg\" alt=\"\" loading=\"lazy\"><div class=\"tag\">ÖNISMERET</div><h3>Miért olyan nehéz jól lenni?</h3><span class=\"time\">Tovább olvasom →</span></a><a class=\"related-card\" href=\"a-szorongas-nem-mindig-latvanyos.html\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/fresh-1-hq.jpg\" alt=\"\" loading=\"lazy\"><div class=\"tag\">ÖNISMERET</div><h3>A szorongás nem mindig látványos</h3><span class=\"time\">Tovább olvasom →</span></a></div></section></main><footer class=\"article-footer\"><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/\">MENTÁL.hu</a><p>Jobb emberek. Teljesebb életek.</p></footer><script>const bar=document.querySelector('.reading-progress');function progress(){const end=document.querySelector('.author-card').getBoundingClientRect().bottom+window.scrollY-window.innerHeight;bar.style.transform='scaleX('+Math.max(0,Math.min(1,window.scrollY/Math.max(1,end)))+')';}addEventListener('scroll',progress,{passive:true});addEventListener('resize',progress);progress();<\/script><script>document.addEventListener(\"click\",function(e){const a=e.target.closest(\"a\");if(a && a.getAttribute(\"href\").endsWith(\".html\")){e.preventDefault();parent.post iv><span class=\"sample-label\">Cikkoldalterv · mintaszöveg</span></div><figure class=\"article-cover\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/rec-2-hq.jpg\" alt=\"Kiégés helyett: értelmes munka és reális elvárások – illusztráció\" fetchpriority=\"high\"><figcaption>Illusztráció · MENTÁL.hu</figcaption></figure><div class=\"article-layout\"><nav class=\"article-outline\" aria-label=\"A cikk tartalma\"><strong>EBBEN AZ ÍRÁSBAN</strong><a href=\"#resz-1\">Mit várunk a munkánktól?</a><a href=\"#resz-2\">A kimondott határok helye</a><a href=\"#resz-3\">A következő beszélgetés</a></nav><div class=\"article-body\" id=\"cikktorzs\"><p class=\"opening\">A munkanap végén nemcsak az számít, mennyi feladat fogyott el, hanem az is, hogyan voltunk jelen benne. Egy hétköznapi jelenet néha közelebb visz ehhez a témához, mint egy tökéletesen megfogalmazott válasz. Érdemes megállni annál, ami ismerős benne, és annál is, ami kérdéseket hagy maga után.</p><p>Nem ugyanazt a történetet hozzuk magunkkal. Más tapasztalataink, kapcsolataink és elvárásaink vannak, ezért ugyanaz a helyzet is mást jelenthet mindannyiunknak.</p><h2 id=\"resz-1\">Mit várunk a munkánktól?</h2><p>A beszélgetés kezdődhet egy egészen egyszerű visszaemlékezéssel. Mikor találkoztunk ezzel legutóbb a saját napjainkban? Mi történt akkor, mit mondtunk, és mi maradt kimondatlanul?</p><p>Az ilyen részletek saját szavakat adhatnak ahhoz, amiről eddig csak általánosságban gondolkodtunk. A történetünknek nem kell rögtön tanulsággal végződnie.</p><blockquote>A reális elvárásokról beszélni is része a közös munkának.</blockquote><h2 id=\"resz-2\">A kimondott határok helye</h2><p>Van, amit szívesen megtartanánk abból, ahogyan eddig éltünk, és van, amit már másként látunk. A kettő megférhet egymás mellett. Nem kell egyetlen mondatban eldöntenünk, hogyan viszonyulunk az egész történethez.</p><p>Egy figyelmes beszélgetésben annak is lehet helye, hogy még nem tudjuk a választ. A másik ember nézőpontja új részleteket mutathat meg, miközben a saját tapasztalatunk is megőrzi a helyét.</p><div class=\"reflection\"><span class=\"small-title\">EGY PILLANAT MAGADRA</span><h3>Mi az, amit ebből magaddal vinnél?</h3><p>Idézz fel egy konkrét pillanatot az elmúlt napokból, amelyhez kapcsolódik ez a téma. Mit mondanál róla most, a saját szavaiddal?</p></div><h2 id=\"resz-3\">A következő beszélgetés</h2><p>A folytatás lehet egy későbbi beszélgetés, egy leírt mondat vagy egy új kérdés. Nem szükséges mindent egyszerre lezárni. Néha az is elég, hogy valamit már pontosabban meg tudunk nevezni.</p><div class=\"author-card\"><div class=\"author-symbol\" aria-hidden=\"true\">M</div><div><strong>Szerző neve</strong><p>A szerző bemutatkozása és szakmai háttere itt jelenik meg a végleges cikkben.</p></div></div></div><aside class=\"article-aside\"><p class=\"margin-word\">Kérdések,<br>amik közelebb<br>visznek.</p></aside></div></article><section class=\"article-related\"><div class=\"related-heading\"><h2>Érdemes tovább olvasni</h2><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/#frissen\">Vissza a friss írásokhoz ↗</a></div><div class=\"related-grid\"><a class=\"related-card\" href=\"az-eletkozepi-fordulopont.html\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/rec-3-hq.jpg\" alt=\"\" loading=\"lazy\"><div class=\"tag\">ÖNISMERET</div><h3>Az életközepi fordulópont – válság vagy lehetőség?</h3><span class=\"time\">Tovább olvasom →</span></a><a class=\"related-card\" href=\"hala-a-kapcsolatainkban.html\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/rec-4-hq.jpg\" alt=\"\" loading=\"lazy\"><div class=\"tag\">KAPCSOLATOK</div><h3>Hála a kapcsolatainkban</h3><span class=\"time\">Tovább olvasom →</span></a><a class=\"related-card\" href=\"miert-olyan-nehez-jol-lenni.html\"><img src=\"https://hammerhead-app-t8i2l.ondigitalocean.app/assets/hero-hq.jpg\" alt=\"\" loading=\"lazy\"><div class=\"tag\">ÖNISMERET</div><h3>Miért olyan nehéz jól lenni?</h3><span class=\"time\">Tovább olvasom →</span></a></div></section></main><footer class=\"article-footer\"><a href=\"https://hammerhead-app-t8i2l.ondigitalocean.app/\">MENTÁL.hu</a><p>Jobb emberek. Teljesebb életek.</p></footer><script>const bar=document.querySelector('.reading-progress');function progress(){const end=document.querySelector('.author-card').getBoundingClientRect().bottom+window.scrollY-window.innerHeight;bar.style.transform='scaleX('+Math.max(0,Math.min(1,window.scrollY/Math.max(1,end)))+')';}addEventListener('scroll',progress,{passive:true});addEventListener('resize',progress);progress();<\/script><script>document.addEventListener(\"click\",function(e){const a=e.target.closest(\"a\");if(a && a.getAttribute(\"href\").endsWith(\".html\")){e.preventDefault();parent.postMessage({article:a.getAttribute(\"href\")},\"*\");}});<\/script></body></html>"};const select=document.getElementById('page'),frame=document.getElementById('preview');function show(key){if(pages[key]){select.value=key;frame.srcdoc=pages[key];}}select.addEventListener('change',()=>show(select.value));addEventListener('message',e=>{if(e.source===frame.contentWindow && e.data.article)show(e.data.article)});show('miert-olyan-nehez-jol-lenni.html');</script></body></html>
