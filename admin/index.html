<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MENTÁL.hu CMS</title><link rel="stylesheet" href="/admin/admin.css"></head><body><div class="shell"><aside class="sidebar"><a href="/" class="brand">MENTÁL<span>.hu</span></a><div class="cms-label">CMS</div><nav><button data-view="articles" class="active">Cikkek</button><button data-view="editor">Új cikk</button><button data-view="media">Képtár</button><button data-view="subscribers">Hírlevél</button></nav><button id="logoutBtn" class="ghost">Kilépés</button></aside><main class="main"><section id="loginView" class="login-card"><h1>Belépés</h1><p>A MENTÁL.hu szerkesztőségi felülete.</p><form id="loginForm"><label>E-mail<input id="loginEmail" type="email" required></label><label>Jelszó<input id="loginPassword" type="password" required></label><button>Belépés</button><div id="loginMsg" class="msg"></div></form></section><section id="appView" hidden><header class="top"><div><h1 id="viewTitle">Cikkek</h1><p id="userLabel"></p></div><button class="primary" id="newArticleBtn">+ Új cikk</button></header><section id="articlesView" class="panel"><div class="toolbar"><input id="articleSearch" placeholder="Keresés cím vagy kategória alapján"><select id="statusFilter"><option value="">Minden státusz</option><option value="draft">Piszkozat</option><option value="published">Publikált</option></select></div><div id="articleTable"></div></section><section id="editorView" class="panel" hidden><form id="articleForm"><input type="hidden" id="articleId"><div class="grid2"><label>Cím<input id="title" required></label><label>Slug<input id="slug" placeholder="automatikus, ha üres"></label></div><div class="grid2"><label>Rovat<select id="category"><option>Önismeret</option><option>Kapcsolatok</option><option>Család</option><option>Test és lélek</option><option>Munka</option><option>Kérdés–válasz</option></select></label><label>Szerző<input id="authorName" value="MENTÁL.hu"></label></div><label>Bevezető / excerpt<textarea id="excerpt" rows="3"></textarea></label><label>Cikk törzse <small>HTML engedélyezett: p, h2, h3, blockquote, ul, ol, li, strong, em, a</small><textarea id="contentHtml" rows="18" placeholder="<p>Első bekezdés...</p>"></textarea></label><div class="media-picker"><div><label>Borítókép ID<input id="heroImageId" type="number" placeholder="képtárból választható"></label><label>Kép alt szöveg<input id="heroImageAlt"></label></div><div id="heroPreview" class="hero-preview">Nincs kép</div></div><div class="grid2"><label>SEO cím<input id="seoTitle"></label><label>SEO leírás<input id="seoDescription"></label></div><div class="grid3"><label>Státusz<select id="status"><option value="draft">Piszkozat</option><option value="published">Publikált</option></select></label><label class="check"><input id="featured" type="checkbox"> Kiemelt cikk</label><div class="actions"><button type="button" class="danger" id="deleteArticleBtn" hidden>Törlés</button><button class="primary">Mentés</button></div></div><div id="editorMsg" class="msg"></div></form></section><section id="mediaView" class="panel" hidden><div class="upload-box"><h2>Kép feltöltése</h2><form id="mediaForm"><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/avif" required><input id="imageAlt" placeholder="Alt szöveg"><button class="primary">Feltöltés</button></form><div id="mediaMsg" class="msg"></div></div><div id="mediaGrid" class="media-grid"></div></section><section id="subscribersView" class="panel" hidden><div class="toolbar"><div><strong>Hírlevél feliratkozók</strong><div id="subscriberCount"></div></div><a class="button" href="/api/admin/subscribers.csv">CSV export</a></div><div id="subscriberTable"></div></section></section></main></div><script src="/admin/admin.js"></script></body></html>
