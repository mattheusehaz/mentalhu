<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MENTÁL.hu CMS</title><link rel="stylesheet" href="/admin/admin.css"></head><body><div class="shell"><aside class="sidebar"><a href="/" class="brand">MENTÁL<span>.hu</span></a><div class="cms-label">CMS</div><nav><button data-view="listings" class="active">Szolgáltatók</button><button data-view="listingEditor">Új szolgáltató</button><button data-view="submissions">Beküldések</button><button data-view="media">Képtár</button><button data-view="subscribers">Hírlevél</button><button data-view="articles">Régi cikkek</button><a href="/admin/kapcsolatfelvetelek.html" class="contact-admin-link">Kapcsolatfelvételek</a></nav><button id="logoutBtn" class="ghost">Kilépés</button></aside><main class="main"><section id="loginView" class="login-card"><h1>Belépés</h1><p>A MENTÁL.hu szerkesztőségi felülete.</p><form id="loginForm"><label>E-mail<input id="loginEmail" type="email" required></label><label>Jelszó<input id="loginPassword" type="password" required></label><button>Belépés</button><div id="loginMsg" class="msg"></div></form></section><section id="appView" hidden><header class="top"><div><h1 id="viewTitle">Szolgáltatók</h1><p id="userLabel"></p></div><button class="primary" id="newArticleBtn">+ Új szolgáltató</button></header><section id="listingsView" class="panel"><div class="toolbar"><input id="listingSearch" placeholder="Keresés szolgáltató, város vagy kategória alapján"><select id="listingStatusFilter"><option value="">Minden státusz</option><option value="draft">Piszkozat</option><option value="pending">Ellenőrzésre vár</option><option value="published">Publikált</option><option value="rejected">Elutasított</option></select></div><div id="listingTable"></div></section>
<section id="listingEditorView" class="panel" hidden><form id="listingForm"><input type="hidden" id="listingId"><div class="grid2"><label>Név<input id="listingName" required></label><label>Slug<input id="listingSlug"></label></div><div class="grid2"><label>Típus<select id="listingKind"><option value="provider">Szakember / szolgáltató</option><option value="organization">Szervezet / rendelő</option><option value="training">Képzés</option><option value="event">Esemény</option><option value="media">Magazin / média</option></select></label><label>Státusz<select id="listingStatus"><option value="draft">Piszkozat</option><option value="pending">Ellenőrzésre vár</option><option value="published">Publikált</option><option value="rejected">Elutasított</option></select></label></div><label>Kategóriák<div id="categoryChecks" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px"></div></label><label>Rövid leírás<textarea id="listingShort" rows="3"></textarea></label><label>Bemutatkozás<textarea id="listingDescription" rows="8"></textarea></label><div class="grid2"><label>Város<input id="listingCity"></label><label>Megye<input id="listingCounty"></label></div><label>Cím<input id="listingAddress"></label><div class="grid2"><label>Weboldal<input id="listingWebsite"></label><label>Foglalási link<input id="listingBooking"></label></div><div class="grid2"><label>E-mail<input id="listingEmail"></label><label>Telefon<input id="listingPhone"></label></div><div class="grid2"><label>Végzettség / képesítés<textarea id="listingQualifications" rows="4"></textarea></label><label>Szakterületek<textarea id="listingSpecialties" rows="4"></textarea></label></div><div class="grid2"><label>Árak / díjazás<input id="listingPrice"></label><label>Nyelvek<input id="listingLanguages" value="Magyar"></label></div><div class="grid2"><label>Profilkép ID<input id="listingProfileImage" type="number"></label><label>Logó ID<input id="listingLogoImage" type="number"></label></div><div class="grid3"><label class="check"><input id="listingOnline" type="checkbox"> Online elérhető</label><label class="check"><input id="listingVerified" type="checkbox"> Ellenőrzött</label><label class="check"><input id="listingFeatured" type="checkbox"> Kiemelt</label></div><label>Admin megjegyzés<textarea id="listingNotes" rows="3"></textarea></label><div class="actions"><button type="button" class="danger" id="deleteListingBtn" hidden>Törlés</button><button class="primary">Mentés</button></div><div id="listingMsg" class="msg"></div></form></section>
<section id="submissionsView" class="panel" hidden><div class="toolbar"><strong>Beérkezett szolgáltatói jelentkezések</strong></div><div id="submissionTable"></div></section><section id="articlesView" class="panel" hidden><div class="toolbar"><input id="articleSearch" placeholder="Keresés cím vagy kategória alapján"><select id="statusFilter"><option value="">Minden státusz</option><option value="draft">Piszkozat</option><option value="published">Publikált</option></select></div><div id="articleTable"></div></section><section id="editorView" class="panel" hidden><form id="articleForm"><input type="hidden" id="articleId"><div class="grid2"><label>Cím<input id="title" required></label><label>Slug<input id="slug" placeholder="automatikus, ha üres"></label></div><div class="grid2"><label>Rovat<select id="category"><option>Önismeret</option><option>Kapcsolatok</option><option>Család</option><option>Test és lélek</option><option>Munka</option><option>Kérdés–válasz</option></select></label><label>Szerző<input id="authorName" value="MENTÁL.hu"></label></div><label>Bevezető / excerpt<textarea id="excerpt" rows="3"></textarea></label><label>Cikk törzse <small>HTML engedélyezett: p, h2, h3, blockquote, ul, ol, li, strong, em, a</small><textarea id="contentHtml" rows="18" placeholder="<p>Első bekezdés...</p>"></textarea></label><div class="media-picker"><div><label>Borítókép ID<input id="heroImageId" type="number" placeholder="képtárból választható"></label><label>Kép alt szöveg<input id="heroImageAlt"></label></div><div id="heroPreview" class="hero-preview">Nincs kép</div></div><div class="grid2"><label>SEO cím<input id="seoTitle"></label><label>SEO leírás<input id="seoDescription"></label></div><div class="grid3"><label>Státusz<select id="status"><option value="draft">Piszkozat</option><option value="published">Publikált</option></select></label><label class="check"><input id="featured" type="checkbox"> Kiemelt cikk</label><div class="actions"><button type="button" class="danger" id="deleteArticleBtn" hidden>Törlés</button><button class="primary">Mentés</button></div></div><div id="editorMsg" class="msg"></div></form></section><section id="mediaView" class="panel" hidden><div class="upload-box"><h2>Kép feltöltése</h2><form id="mediaForm"><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/avif" required><input id="imageAlt" placeholder="Alt szöveg"><button class="primary">Feltöltés</button></form><div id="mediaMsg" class="msg"></div></div><div id="mediaGrid" class="media-grid"></div></section><section id="subscribersView" class="panel" hidden><div class="toolbar"><div><strong>Hírlevél feliratkozók</strong><div id="subscriberCount"></div></div><a class="button" href="/api/admin/subscribers.csv">CSV export</a></div><div id="subscriberTable"></div></section></section></main></div><script src="/admin/admin.js"></script></body></html>
